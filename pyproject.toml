[project]
name = "green-assistant"
version = "0.1.0"
description = "Учебный Django-проект: Зелёный помощник"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "djlint>=1.47.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 75
show_missing = true
precision = 2

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 88
format_css = false
format_js = false
