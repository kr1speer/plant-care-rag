name: Quality and KT1 tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.3"
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync djlint app/assistant/templates --lint
      - run: uv run --no-sync djlint app/assistant/templates --check
      - run: npm run lint
      - run: npm run format:check

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.3"
          python-version: "3.13"
      - name: Generate a temporary test key
        shell: bash
        run: |
          key="$(openssl rand -hex 48)"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run --no-sync python manage.py check
      - run: uv run --no-sync coverage run manage.py test tests
      - run: uv run --no-sync coverage report
      - run: uv run --no-sync coverage xml
        if: ${{ !cancelled() }}
      - run: uv run --no-sync coverage html
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
          if-no-files-found: warn

  container-browser:
    needs: [quality, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: green-assistant-ci
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Generate a temporary container key
        shell: bash
        run: |
          key="$(openssl rand -hex 48)"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --no-build
      - name: Wait for the application
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 --output /dev/null "$BASE_URL/"; then
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become ready" >&2
          exit 1
      - run: docker compose exec -T web uv run --no-sync python manage.py check
      - run: docker compose exec -T web uv run --no-sync python manage.py test tests
      - run: npm run test:browser
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color > docker.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-and-container
          path: |
            playwright-report/
            test-results/
            docker.log
          retention-days: 7
          if-no-files-found: warn
      - name: Stop temporary containers
        if: always()
        run: docker compose down --remove-orphans
