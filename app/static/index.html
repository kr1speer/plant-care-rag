<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Зелёный помощник</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Зелёный помощник</h1>
    <p class="muted">Вопросы об уходе за комнатными растениями</p>

    <form id="ask-form">
      <input id="question" type="text" placeholder="Например: как часто поливать монстеру зимой?" required>
      <button type="submit">Спросить</button>
    </form>

    <section id="answer" class="card" hidden>
      <h2>Ответ</h2>
      <p id="answer-text"></p>
    </section>

    <section id="sources" hidden>
      <h2>Источники</h2>
      <div id="sources-list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
