{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Зелёный помощник</title>
    <link rel="stylesheet" href="{% static 'assistant/style.css' %}">
    <script src="{% static 'assistant/app.js' %}" defer></script>
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="intro">
          <p class="kicker">Комнатные растения</p>
          <h1>Зелёный <em>помощник</em></h1>
          <p id="help">Спросите об уходе за вашим растением. В ответе вы найдёте выдержки из статей и ссылки на источники.</p>
        </div>
        <figure>
          <img src="{% static 'assistant/monstera.jpg' %}"
               alt="Резные листья монстеры"
               width="1536"
               height="1024">
          <figcaption lang="la">Monstera deliciosa</figcaption>
        </figure>
      </header>
      <form id="ask-form" action="{% url 'ask' %}" method="post">
        {% csrf_token %}
        <label for="question">Ваш вопрос</label>
        <div class="form-row">
          <input id="question"
                 name="question"
                 type="text"
                 aria-describedby="help"
                 placeholder="Например: как часто поливать орхидею?"
                 required>
          <button id="submit" type="submit">Спросить</button>
        </div>
      </form>
      <noscript>
        <p>Для отправки вопроса включите JavaScript в браузере.</p>
      </noscript>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="refusal"
               class="card refusal"
               aria-labelledby="refusal-heading"
               hidden>
        <h2 id="refusal-heading">Ответа в документах нет</h2>
        <p id="refusal-text"></p>
      </section>
      <section id="answer" class="card" aria-labelledby="answer-heading" hidden>
        <h2 id="answer-heading">Ответ</h2>
        <p id="answer-text"></p>
      </section>
      <section id="sources" aria-labelledby="sources-heading" hidden>
        <h2 id="sources-heading">Источники</h2>
        <div id="sources-list"></div>
      </section>
      <section class="suggestions" aria-labelledby="examples-heading">
        <h2 id="examples-heading">Примеры вопросов</h2>
        <div class="examples">
          {% for example in examples %}
            <button type="button" class="example" data-question="{{ example }}">
              <span>{{ example }}</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
          {% endfor %}
        </div>
      </section>
    </main>
  </body>
</html>
